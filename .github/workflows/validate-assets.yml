name: Validate assets
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  mesh-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python tools/validate_assets.py
  catalog-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet run --project tests/CatalogMerge.Tests/CatalogMerge.Tests.csproj --configuration Release
